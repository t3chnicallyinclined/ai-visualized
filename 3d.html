<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LLM Plinko 3D</title>
<meta name="description" content="LLM Plinko as a 3D tower: tokens fall through every layer of a language model. Orbit around it, or run a real small model in your browser.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2712%27 fill=%27%23ff5c8a%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: the 3D tower fills the screen; a prompt bar on top, the caption bottom-left, the model panel right, the transport along the bottom.
   One deliberate dark look: glowing layers read best on a night background. */
:root {
  --bg: #080914; --glass: rgb(16 18 38 / 0.8); --line: #2c3263; --ink: #e9ebfa; --muted: #9399c6;
  --accent: #ff5c8a; --kv: #3fd0e0; --wt: #8b84ff; --peg: #d9b45a;
  --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--body); overflow: hidden; }
[hidden] { display: none !important; }
#scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
.hud { position: fixed; inset: 0; pointer-events: none; display: grid; gap: 12px;
  grid-template-columns: minmax(0, 430px) 1fr minmax(0, 310px); grid-template-rows: auto 1fr auto auto;
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hud > * { pointer-events: auto; }
.panel { background: var(--glass); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); min-width: 0; }
.top { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
h1 { font: 800 26px/1 var(--display); margin: 0; letter-spacing: -0.02em; }
h1 span { color: var(--accent); }
a { color: var(--ink); }
.back { font: 600 13px var(--body); text-decoration: none; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--glass); }
.back:hover { border-color: var(--accent); }
form { display: flex; gap: 8px; flex: 1 1 320px; min-width: 0; }
#prompt { flex: 1 1 auto; min-width: 0; font: 500 15px var(--mono); padding: 10px 14px; border-radius: 9px;
  border: 1px solid var(--line); background: var(--glass); color: var(--ink); }
button { font: 600 13px var(--body); border-radius: 8px; border: 1px solid var(--line); background: var(--glass); color: var(--ink);
  padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
#drop { background: var(--accent); border-color: var(--accent); color: #fff; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cap { grid-column: 1; grid-row: 3; display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font: 600 11px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0; }
#capTitle { font: 800 24px/1.1 var(--display); margin: 0; color: var(--accent); text-wrap: balance; }
#capText { margin: 0; text-wrap: pretty; }
#where { color: var(--kv); }
.side { grid-column: 3; grid-row: 2 / 4; align-self: end; display: flex; flex-direction: column; gap: 10px; max-height: 100%; overflow: auto; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; } .seg button { flex: 1 1 auto; }
dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 13px; }
dt { color: var(--muted); } dd { margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
.legend { display: grid; gap: 4px; font-size: 12px; color: var(--muted); margin: 0; padding: 0; list-style: none; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.note { font-size: 12px; color: var(--muted); margin: 0; text-wrap: pretty; }
.prog { height: 6px; border-radius: 3px; background: #1b1f40; overflow: hidden; } .prog span { display: block; height: 100%; width: 0; background: var(--accent); }
.transport { grid-column: 1 / -1; grid-row: 4; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#scrub { flex: 1 1 200px; min-width: 0; accent-color: var(--accent); }
.speed button { font: 500 12px var(--mono); padding: 6px 9px; }
@media (max-width: 760px) {
  .hud { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  h1 { font-size: 21px; }
  .cap { padding: 10px 12px; }
  #capTitle { font-size: 19px; } #capText { font-size: 13px; }
  .side { display: none; }
}
</style>
</head>
<body>

<canvas id="scene" aria-label="3D tower of model layers with tokens falling through it"></canvas>
<div class="hud">
  <div class="top">
    <h1>LLM Plinko <span>3D</span></h1>
    <a class="back" href="./">2D board</a>
    <form id="promptForm" autocomplete="off">
      <input id="prompt" type="text" maxlength="120" value="the fighter blocked the fireball and" aria-label="Prompt">
      <button id="drop" type="submit">Drop it</button>
    </form>
  </div>

  <div class="panel cap" aria-live="polite">
    <p class="eyebrow" id="capStep">Step 1 of 6</p>
    <h2 id="capTitle">Tokenize</h2>
    <p id="capText"></p>
    <p class="eyebrow" id="where"></p>
  </div>

  <div class="side">
    <div class="panel" style="display:flex;flex-direction:column;gap:10px">
      <p class="eyebrow">Model</p>
      <div class="seg" role="group" aria-label="Model">
        <button type="button" data-mode="dense" aria-pressed="true">Dense 27B</button>
        <button type="button" data-mode="moe" aria-pressed="false">MoE 35B-A3B</button>
        <button type="button" data-mode="real" aria-pressed="false">Real: SmolLM2-135M-Instruct</button>
      </div>
      <div id="realLoad" hidden style="display:flex;flex-direction:column;gap:6px">
        <p class="note" id="realIntro">Runs a real small model in your browser: a 269 MB download from Hugging Face (kept by your browser) and about 800 MB of memory.</p>
        <button id="realGo" type="button">Download and run</button>
        <div class="prog" id="prog" aria-hidden="true"><span id="progBar"></span></div>
        <p class="note" id="realStatus" aria-live="polite"></p>
      </div>
      <dl>
        <dt>Layers</dt><dd id="sLayers"></dd>
        <dt>Tokens in KV cache</dt><dd id="sKv">0</dd>
        <dt>KV cache size</dt><dd id="sKvMb">0</dd>
        <dt>Linear memory</dt><dd id="sMem"></dd>
        <dt>Tokens written</dt><dd id="sGen">0 of 6</dd>
      </dl>
      <button id="silo" type="button" aria-pressed="false">Show memory as one pool</button>
    </div>
    <div class="panel">
      <ul class="legend" id="legend"></ul>
    </div>
    <p class="note panel" id="modeNote"></p>
  </div>

  <div class="transport">
    <button id="play" type="button">Play</button>
    <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Scrub timeline">
    <div class="speed" role="group" aria-label="Speed" style="display:flex;gap:4px">
      <button type="button" data-speed="0.5" aria-pressed="false">0.5×</button>
      <button type="button" data-speed="1" aria-pressed="true">1×</button>
      <button type="button" data-speed="2" aria-pressed="false">2×</button>
    </div>
    <button id="follow" type="button" aria-pressed="true">Follow tokens</button>
    <button id="autoRot" type="button" aria-pressed="true">Orbit</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="llm.js"></script>
<script>
(function () {
  const $ = s => document.querySelector(s);
  function hash(s) { let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h >>> 0; }
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
  const fmtPct = p => (p >= 0.995 ? '100%' : p < 0.005 ? '<1%' : Math.round(p * 100) + '%');

  // ---- toy next-word model (same as the 2D page): a bigram table over a short built-in text ----
  const CORPUS = `the ball drops through the board and hits every peg on the way down. the model reads your prompt and guesses the next token.
  the next token is picked by a roll of the dice. the fighter blocked the fireball and then he countered with a super.
  the player pressed the button and the character jumped over the fireball. the gpu reads every weight from memory for every new token.
  the weights are fixed numbers that decide where the ball goes. the board has sixty layers and billions of pegs.
  the game is a fighting game with rollback netcode. the match starts when both players press start. a token is a small piece of a word.
  the cache keeps the work for every earlier token. the dice decide which slot wins. the answer comes out one word at a time.
  he blocked the super and then he jumped. the fighter countered with a fireball and the match was over.`;
  const WORDS = CORPUS.toLowerCase().match(/[a-z']+|[.,]/g), BIG = {}, UNI = {};
  WORDS.forEach((w, i) => { UNI[w] = (UNI[w] || 0) + 1; if (i + 1 < WORDS.length) { const f = BIG[w] || (BIG[w] = {}); f[WORDS[i + 1]] = (f[WORDS[i + 1]] || 0) + 1; } });
  const UNI_TOP = Object.entries(UNI).sort((a, b) => b[1] - a[1]);
  function candidates(last, T) {
    const f = BIG[last] || {}; let list = Object.entries(f);
    for (const [w, c] of UNI_TOP) { if (list.length >= 5) break; if (!f[w]) list.push([w, 0.06 * c]); }
    list.sort((a, b) => b[1] - a[1]); list = list.slice(0, 5);
    const lg = list.map(([, c]) => Math.log(c)), e = lg.map(l => Math.exp((l - lg[0]) / T)), s = e.reduce((a, b) => a + b, 0);
    return list.map(([w], i) => ({ w, p: e[i] / s }));
  }
  function sample(c, r) { let u = r(), acc = 0; for (let i = 0; i < c.length; i++) { acc += c[i].p; if (u <= acc) return i; } return c.length - 1; }
  function tokenize(text) {
    const out = [];
    for (const p of text.trim().match(/[A-Za-z']+|\d+|[^\sA-Za-z\d]/g) || []) {
      if (p.length > 7 && /[A-Za-z]/.test(p)) { const cut = Math.ceil(p.length / 2); out.push(p.slice(0, cut), p.slice(cut)); } else out.push(p);
    }
    return out;
  }
  const lastWord = t => { const m = t.toLowerCase().match(/[a-z']+|[.,]/g); return m ? m[m.length - 1] : 'the'; };
  const T0 = 0.7; // same default temperature as the 2D page
  const getPrompt = () => ($('#prompt').value.trim() || 'the fighter blocked the fireball and').slice(0, 120);

  // Model shapes. Qwen3.6 figures from its config.json: every 4th layer full attention, the rest linear attention.
  // SmolLM2-135M: full attention in all 30 layers, KV cache 23,040 bytes per token (2 x 30 layers x 3 heads x 64 x 2 bytes).
  const MODELS = {
    dense: { layers: 64, full: l => (l + 1) % 4 === 0, kvKB: 64, memMB: 151, label: 'Qwen3.6-27B' },
    moe: { layers: 40, full: l => (l + 1) % 4 === 0, kvKB: 20, memMB: 63, label: 'Qwen3.6-35B-A3B', experts: true },
    real: { layers: 30, full: () => true, kvKB: 22.5, memMB: 0, label: 'SmolLM2-135M-Instruct' },
  };
  const STAGES = [
    ['Tokenize', 'Your text is cut into tokens. Each gets an ID from a vocabulary of about 250,000.'],
    ['Embed', 'Each token becomes a ball: a list of a few thousand numbers, its meaning fingerprint.'],
    ['Read the prompt', 'All tokens fall through every layer at once. Pink layers (every 4th) use full attention: the last token arcs back to every earlier one, and each token drops a teal KV tile. Blue layers squeeze everything into one fixed memory cube. Violet glow: feed-forward weights being read.'],
    ['Score', 'The last ball lands as a score for every token in the vocabulary. The top five rise as bars.'],
    ['Roll', 'A weighted die picks one. The new token flies back to the top.'],
    ['Repeat', 'The new token falls alone. It reads the KV tiles and memory cubes left behind instead of redoing that work, but every weight is read again: one full trip down the tower per token.'],
  ];
  const STAGES_REAL = [
    ['Tokenize', 'The model\'s own tokenizer cuts your text into pieces it learned (49,152 of them). A dot (·) means the piece starts with a space.'],
    ['Embed', 'Each token becomes a ball: a list of 576 real numbers.'],
    ['Read the prompt', 'All tokens fall through 30 layers, all full attention. The arcs are the model\'s real attention for the last token, and each layer stores every token\'s keys and values (the tiles). The word above the ball is what the model would say if it stopped at that layer.'],
    ['Score', 'The last ball lands as a real score for each of the 49,152 tokens. The top five rise as bars.'],
    ['Roll', 'A weighted die picks one. The new token flies back to the top.'],
    ['Repeat', 'The new token falls alone, reading every layer\'s cached keys and values, while all 269 MB of weights are read again.'],
  ];
  const DONE = ['Done', 'Six new tokens, six trips down the tower. Watch the KV tile rows: they grew with every token, while the memory cubes stayed the same size.'];
  const DONE_REAL = ['Done', 'Six new tokens, six trips down the tower. Every layer\'s KV tile row grew by one tile per token. Try "Show memory as one pool" to see where they all live.'];

  // ---- three.js scene ----
  const SP = 0.46, TOP = 2.2, W = 10.4, D = 3.4, GAP = 0.7, SILO_X = W / 2 + 3.6;
  const canvas = $('#scene');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x080914);
  scene.fog = new THREE.Fog(0x080914, 22, 60);
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
  camera.position.set(7.5, TOP + 3.6, 11.5);
  const controls = new THREE.OrbitControls(camera, canvas); controls.target.set(0, TOP, 0);
  controls.enableDamping = true; controls.dampingFactor = 0.08; controls.minDistance = 4; controls.maxDistance = 70;
  scene.add(new THREE.AmbientLight(0x8890c0, 0.55));
  const key = new THREE.DirectionalLight(0xffffff, 0.9); key.position.set(6, 12, 8); scene.add(key);
  const rim = new THREE.PointLight(0xff5c8a, 0.6, 40); rim.position.set(-8, 2, -6); scene.add(rim);

  const C = { accent: 0xff5c8a, kv: 0x3fd0e0, wt: 0x8b84ff, linear: 0x3b4fa8, peg: 0xd9b45a };
  const plateY = l => -l * SP;

  function label(text, { size = 64, color = '#e9ebfa', bg = null, border = null, weight = 500, scale = 1 } = {}) {
    const pad = size * 0.4, cv = document.createElement('canvas'), cx = cv.getContext('2d');
    cx.font = `${weight} ${size}px 'IBM Plex Mono', monospace`;
    const w = Math.ceil(cx.measureText(text).width + pad * 2), h = Math.ceil(size * 1.6);
    cv.width = w; cv.height = h;
    cx.font = `${weight} ${size}px 'IBM Plex Mono', monospace`;
    if (bg) { cx.fillStyle = bg; cx.strokeStyle = border || bg; cx.lineWidth = size * 0.08;
      cx.beginPath(); cx.roundRect ? cx.roundRect(2, 2, w - 4, h - 4, size * 0.3) : cx.rect(2, 2, w - 4, h - 4); cx.fill(); cx.stroke(); }
    cx.fillStyle = color; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText(text, w / 2, h / 2 + size * 0.04);
    const tex = new THREE.CanvasTexture(cv); tex.minFilter = THREE.LinearFilter;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
    sp.scale.set(w / h * 0.42 * scale, 0.42 * scale, 1);
    return sp;
  }
  function curve(a, b, lift) {
    const mid = a.clone().add(b).multiplyScalar(0.5); mid.y += lift; mid.z -= lift * 0.6;
    const g = new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(a, mid, b), 28, 0.028, 6, false);
    return new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: C.accent, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending }));
  }

  const S = { mode: 'dense', time: 0, playing: false, speed: 1, follow: true, orbit: !matchMedia('(prefers-reduced-motion: reduce)').matches,
    silo: false, siloK: 0, llm: null, loading: null, wantReal: false, data: null };
  let world = null, P = null;

  function dispose(o) { o.traverse(n => { if (n.geometry) n.geometry.dispose(); if (n.material) { if (n.material.map) n.material.map.dispose(); n.material.dispose(); } }); }

  // ---- data: toy word table, or the real model ----
  function toyData(prompt) {
    let toks = tokenize(prompt); if (!toks.length) toks = ['?']; if (toks.length > 9) toks = toks.slice(-9);
    const nP = toks.length, r = rng(hash(prompt));
    let last = lastWord(prompt); const steps = [];
    for (let k = 0; k < 6; k++) { const c = candidates(last, T0), pick = sample(c, r); steps.push({ c, pick }); last = c[pick].w; }
    return { real: false, nP, offset: 0, steps, all: toks.concat(steps.map(s => s.c[s.pick].w)) };
  }
  async function realData(prompt, onStatus) {
    const m = S.llm, tok = m.tok;
    let ids = tok.encode(prompt); if (!ids.length) ids = tok.encode('the');
    const st = m.newState(), total = ids.length + 5, r = rng(hash(prompt + '|' + T0 + '|real')); // same seed as the 2D page
    let res, done = 0;
    for (let i = 0; i < ids.length; i++) { res = await m.step(st, ids[i], i === ids.length - 1); onStatus(++done, total); }
    const recs = [res.rec], steps = [], ms = [res.ms];
    for (let k = 0; k < 6; k++) {
      const { cands, pick } = LLM.sampleTopK(res.logits, 5, T0, r);
      steps.push({ c: cands.map(c => ({ w: tok.piece(c.id), id: c.id, p: c.p })), pick });
      if (k < 5) { res = await m.step(st, cands[pick].id, true); recs.push(res.rec); ms.push(res.ms); onStatus(++done, total); }
    }
    const shown = ids.slice(-9);
    return { real: true, nP: shown.length, offset: ids.length - shown.length, steps, recs, ms: ms.reduce((a, b) => a + b, 0) / ms.length,
      all: shown.map(id => tok.piece(id)).concat(steps.map(s => s.c[s.pick].w)) };
  }

  function build() {
    if (world) { scene.remove(world); dispose(world); }
    world = new THREE.Group(); scene.add(world);
    const M = MODELS[S.mode], L = M.layers, Dd = S.data, real = Dd.real;
    const { nP, steps, all } = Dd, NG = 6, N = nP + NG;
    const X = i => (i - (N - 1) / 2) * GAP;
    const yEnd = plateY(L - 1) - 0.8, FLOOR = yEnd - 2.2;
    const short = w => (w.length > 5 ? w.slice(0, 4) + '…' : w);

    // layers
    const plates = [], mem = [], experts = [], kvTiles = [];
    const pegPos = [];
    for (let l = 0; l < L; l++) {
      const full = M.full(l), y = plateY(l);
      const mat = new THREE.MeshStandardMaterial({ color: full ? C.accent : C.linear, emissive: C.wt, emissiveIntensity: 0, transparent: true, opacity: full ? 0.1 : 0.08, depthWrite: false, side: THREE.DoubleSide });
      const plate = new THREE.Mesh(new THREE.BoxGeometry(W, 0.04, D), mat); plate.position.y = y; world.add(plate);
      const edge = new THREE.LineSegments(new THREE.EdgesGeometry(plate.geometry), new THREE.LineBasicMaterial({ color: full ? C.accent : C.linear, transparent: true, opacity: full ? (real ? 0.3 : 0.45) : 0.25 }));
      edge.position.y = y; world.add(edge);
      plates.push({ mat, full, y });
      const named = real ? (l === 0 || (l + 1) % 5 === 0) : (full || l === 0);
      if (named) { const lb = label('Layer ' + (l + 1) + (full ? ' · full' : ' · linear'), { size: 40, color: full ? '#ff8fae' : '#8fa0ff', scale: 1 }); lb.position.set(-W / 2 - 1.2, y, 0); world.add(lb); }
      if (full) {
        kvTiles[l] = all.map((_, i) => {
          const m = new THREE.Mesh(new THREE.BoxGeometry(GAP * 0.7, 0.05, 0.32), new THREE.MeshStandardMaterial({ color: C.kv, emissive: C.kv, emissiveIntensity: 0.3, transparent: true, opacity: 0 }));
          m.userData.home = new THREE.Vector3(X(i), y + 0.05, -D / 2 + 0.35);
          m.userData.silo = new THREE.Vector3(SILO_X - 1.9 + i * 0.27, y, 0.15);
          m.position.copy(m.userData.home); world.add(m); return m;
        });
      } else {
        const cube = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.3, 0.42), new THREE.MeshStandardMaterial({ color: C.kv, emissive: C.kv, emissiveIntensity: 0.15, transparent: true, opacity: 0.85 }));
        cube.userData.home = new THREE.Vector3(W / 2 + 0.55, y, 0); cube.userData.silo = new THREE.Vector3(SILO_X, y, 0.15);
        cube.position.copy(cube.userData.home); world.add(cube); mem[l] = cube;
      }
      if (M.experts) {
        experts[l] = [];
        for (let e = 0; e < 8; e++) {
          const em = new THREE.Mesh(new THREE.BoxGeometry(W / 8 - 0.12, 0.06, 0.5), new THREE.MeshStandardMaterial({ color: e ? C.wt : 0xb6b0ff, emissive: C.wt, emissiveIntensity: 0, transparent: true, opacity: 0.22 }));
          em.position.set(-W / 2 + (e + 0.5) * W / 8, y, D / 2 - 0.4); world.add(em); experts[l].push(em);
        }
      }

  $('#autoRot').addEventListener('click', e => { S.orbit = !S.orbit; e.target.setAttribute('aria-pressed', S.orbit); });
  $('#autoRot').setAttribute('aria-pressed', S.orbit);
  window.__plinko3d = { seek: t => { S.playing = false; S.time = t; apply(t); }, get duration() { return P.tEnd; }, get mode() { return S.mode; } };

  const start = () => { startToy(); requestAnimationFrame(frame); };
  (document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]) : Promise.resolve()).then(start);
})();
</script>
